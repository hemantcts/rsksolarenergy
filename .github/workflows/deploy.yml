name: Build and deploy

# Every push to main builds the site, runs every check, and uploads it to the live host.
# A check that fails stops the deploy, so main is always safe to publish.
#
# Run it by hand with "Dry run" ticked to test the SSH connection and see what would change
# without touching the server.
#
# Secrets to add in GitHub (Settings, Secrets and variables, Actions):
#   SSH_HOST      the host's SSH server, from hPanel, Advanced, SSH Access
#   SSH_USER      the SSH user
#   SSH_KEY       the private key, whole file including the BEGIN and END lines
#   DEPLOY_PATH   the web root, e.g. /home/<user>/domains/rsksolarenergy.com/public_html
# Optional variables (same page, Variables tab):
#   SSH_PORT        defaults to 22. Hostinger uses 65002.
#   DEPLOY_DELETE   "true" removes files on the host that are not in the build. The KEEP list
#                   below is still protected. Leave it unset unless you want that tidy-up.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'files/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: connect and list changes, upload nothing'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Other things living in the web root that this site must never touch: the applications on
  # subdomains, and the host's own files. Protected whether or not DEPLOY_DELETE is on.
  KEEP: >-
    --exclude rates/
    --exclude newoffice/
    --exclude .well-known/
    --exclude cgi-bin/
    --exclude .user.ini
    --exclude error_log
    --exclude php.ini

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        # Also runs the SEO guard, which fails the build on a broken rule.
        run: npm run build

      - name: Writing check
        run: npm run tells

      - name: Page weight budget
        run: npm run budget

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check the connection
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "echo 'Connected as' \$(whoami); test -d '$DEPLOY_PATH' || { echo 'DEPLOY_PATH does not exist: $DEPLOY_PATH'; exit 1; }; echo 'Web root holds:'; ls -1 '$DEPLOY_PATH' | head -20"

      - name: Upload the site
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_DELETE: ${{ vars.DEPLOY_DELETE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FLAGS="-rlvz --checksum"
          if [ "$DEPLOY_DELETE" = "true" ]; then FLAGS="$FLAGS --delete"; fi
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run --itemize-changes"; echo "DRY RUN: nothing will be written."; fi
          rsync $FLAGS $KEEP \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Check the live site
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          for path in / /solar-calculator/ /blog/ /search-index.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rsksolarenergy.com$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -s https://rsksolarenergy.com/ | grep -q 'RSK Solar Energy' || exit 1

      - name: Check the subdomain apps still answer
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: |
          for host in rates newoffice; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host.rsksolarenergy.com/" || echo 000)
            echo "$host -> $code"
          done

      - name: Tell the search engines
        if: ${{ inputs.dry_run != true }}
        # IndexNow covers Bing, Yandex, Seznam and Naver. Google finds new pages through the
        # sitemap, which is already submitted in Search Console.
        run: npm run indexnow
