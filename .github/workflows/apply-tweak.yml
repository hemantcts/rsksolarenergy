name: Apply an approved tweak

# The other half of the email approval. n8n reads the mailbox, finds a reply to a proposal, and calls
# GitHub here. A yes merges the branch into main, which deploys it. A no deletes the branch.
#
# Three things have to line up before anything is merged, so a spoofed email cannot push a change:
#   1. the reply came from the address that was sent the proposal;
#   2. the branch is named tweak/<slug>;
#   3. the code in the subject line matches the token in that branch's proposal file. Only somebody
#      who was actually sent the email has that code.
#
# Call it with a repository_dispatch:
#
#   curl -X POST https://api.github.com/repos/hemantcts/rsksolarenergy/dispatches \
#     -H 'authorization: Bearer <PAT with repo scope>' \
#     -H 'accept: application/vnd.github+json' \
#     -d '{"event_type":"tweak-decision","client_payload":{
#           "branch":"tweak/five-kw-price","token":"7f3a91c4","decision":"yes",
#           "from":"rajdeep.crest@gmail.com","quote":"the first line of the reply"}}'
#
# Secrets: SMTP_USER, SMTP_PASS.

on:
  repository_dispatch:
    types: [tweak-decision]

permissions:
  contents: write

env:
  MAIL_TO: rajdeep.crest@gmail.com
  BRANCH: ${{ github.event.client_payload.branch }}
  TOKEN: ${{ github.event.client_payload.token }}
  DECISION: ${{ github.event.client_payload.decision }}
  FROM: ${{ github.event.client_payload.from }}
  QUOTE: ${{ github.event.client_payload.quote }}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check who sent it, and that they were sent the proposal
        id: check
        run: |
          set -e
          sender=$(printf '%s' "$FROM" | tr 'A-Z' 'a-z' | tr -d ' <>')
          allowed=$(printf '%s' "$MAIL_TO" | tr 'A-Z' 'a-z')
          if [ "$sender" != "$allowed" ]; then
            echo "The reply came from '$sender', not $allowed. Nothing done."
            exit 1
          fi

          case "$BRANCH" in
            tweak/*) ;;
            *) echo "'$BRANCH' is not a tweak/<slug> branch. Nothing done."; exit 1 ;;
          esac
          printf '%s' "$BRANCH" | grep -Eq '^tweak/[a-z0-9][a-z0-9-]{0,60}$' || {
            echo "'$BRANCH' is not a name this workflow will act on. Nothing done."; exit 1; }

          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || {
            echo "There is no branch $BRANCH any more. It may have been applied or dropped already."; exit 1; }

          slug="${BRANCH#tweak/}"
          expected=$(git show "origin/$BRANCH:files/proposals/$slug.md" | sed -n 's/^token:[[:space:]]*//p' | head -1)
          subject=$(git show "origin/$BRANCH:files/proposals/$slug.md" | sed -n 's/^subject:[[:space:]]*//p' | head -1)
          given=$(printf '%s' "$TOKEN" | tr 'A-Z' 'a-z' | tr -d ' ')
          if [ -z "$expected" ] || [ "$given" != "$expected" ]; then
            echo 'The code in the subject line does not match this branch. Nothing done.'
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - name: Read the answer
        id: answer
        run: |
          said=$(printf '%s' "$DECISION" | tr 'A-Z' 'a-z')
          case "$said" in
            yes|y|approve|approved|'go ahead'|ok|okay|do\ it|ship\ it) echo 'verdict=yes' >> "$GITHUB_OUTPUT" ;;
            no|n|reject|rejected|stop|cancel|don\'t|dont) echo 'verdict=no' >> "$GITHUB_OUTPUT" ;;
            *) echo 'verdict=unclear' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Merge it into main
        if: ${{ steps.answer.outputs.verdict == 'yes' }}
        id: merge
        run: |
          set -e
          git config user.name 'rsk-content-bot'
          git config user.email 'noreply@rsksolarenergy.com'
          git checkout main
          git pull --ff-only origin main
          git merge --no-ff "origin/$BRANCH" -m "Approved by email: ${{ steps.check.outputs.subject }}" \
            || { echo 'This does not merge cleanly into main any more. Nothing applied.'; exit 1; }
          git push origin main
          git push origin --delete "$BRANCH"

      - name: Deploy it
        if: ${{ steps.answer.outputs.verdict == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f dry_run=false

      - name: Drop the branch
        if: ${{ steps.answer.outputs.verdict == 'no' }}
        run: git push origin --delete "$BRANCH"

      - name: Write the reply
        if: ${{ always() && steps.answer.outputs.verdict != '' }}
        env:
          VERDICT: ${{ steps.answer.outputs.verdict }}
          MERGED: ${{ steps.merge.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "$VERDICT" = 'yes' ] && [ "$MERGED" = 'success' ]; then
              echo 'Done. It is merged and going live now, which takes a few minutes.'
            elif [ "$VERDICT" = 'yes' ]; then
              echo 'It could not be merged, so nothing changed on the live site and the branch is still there.'
            elif [ "$VERDICT" = 'no' ]; then
              echo 'Understood. Nothing was changed, and the branch has been deleted.'
            else
              echo 'That was not a clear yes or a clear no, so nothing was changed and the branch is'
              echo 'still waiting. Reply yes or no and it goes through. What came back was:'
              echo
              echo "$QUOTE"
            fi
            echo
            echo "$RUN"
          } > reply-body.txt
          cat reply-body.txt

      - name: Say what happened
        if: ${{ always() && steps.answer.outputs.verdict != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: RSK Solar Energy site <${{ secrets.SMTP_USER }}>
          to: ${{ env.MAIL_TO }}
          subject: 'Re: [RSK tweak ${{ github.event.client_payload.token }}] ${{ steps.check.outputs.subject }}'
          body: file://reply-body.txt
