name: Write and publish a blog post

# Tuesday and Friday: pick a topic, write the post, put it through four checks, and publish it.
# Nobody approves it beforehand, so the checks are what stand between a draft and the live site:
#
#   1. scripts/check-draft.mjs   every figure has to be ours or arithmetic on ours; no banned
#                                claims; links exist; brand and warranty rules; a chart; length.
#   2. scripts/review-draft.mjs  a model that did not write the post reads it against our own
#                                figures and votes publish or hold. Where both keys work that is
#                                the other provider, so a mistake has to get past two models.
#   3. npm run build             the SEO guard, the schema rules and the internal link check.
#   4. npm run tells             the AI-writing check.
#
# Any one of them failing means nothing is published and the run goes red. Once the post is live
# its URL is emailed, so it can be read on the site and pulled if it reads wrong.
#
# Secrets used: ANTHROPIC_API_KEY and/or OPENAI_API_KEY, GSC_SA_JSON, SMTP_USER, SMTP_PASS.

on:
  schedule:
    # Tuesday and Friday at 05:00 UTC, which is 10:30 in Mohali.
    - cron: '0 5 * * 2,5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic, in plain words. Leave empty for the top line of files/TOPICS.md, then the search report.'
        type: string
        required: false

permissions:
  contents: write
  # Pushing with the built-in token does not start another workflow, so the deploy is asked for
  # by name once the post is on main.
  actions: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

env:
  MAIL_TO: rajdeep.crest@gmail.com

jobs:
  write:
    env:
      # Where the mail goes out through. Defaults suit a Gmail address with an app password; set the
      # MAIL_* repository variables to send through Amazon SES or any other provider instead.
      MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.gmail.com' }}
      MAIL_PORT: ${{ vars.MAIL_PORT || '465' }}
      # SES usernames are not email addresses, so the visible sender is set apart from the login.
      MAIL_FROM: ${{ vars.MAIL_FROM || secrets.SMTP_USER }}
      # Hoisted so the mail steps can ask whether mail is set up at all: a step's "if" reads env,
      # never secrets.
      SMTP_USER: ${{ secrets.SMTP_USER }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Latest search figures
        continue-on-error: true
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: node scripts/seo-report.mjs > /dev/null

      - name: Write the draft
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: node scripts/draft-post.mjs

      - name: Check 1, the figures and the claims
        run: node scripts/check-draft.mjs "src/content/blog/${{ steps.draft.outputs.slug }}.mdx"

      - name: Check 2, read by the other model
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRAFT_PROVIDER: ${{ steps.draft.outputs.provider }}
        run: node scripts/review-draft.mjs "src/content/blog/${{ steps.draft.outputs.slug }}.mdx"

      - name: Check 3, the build and the SEO guard
        run: npm run build

      - name: Check 4, the writing check
        run: npm run tells

      - name: Publish
        env:
          SLUG: ${{ steps.draft.outputs.slug }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          git config user.name 'rsk-content-bot'
          git config user.email 'noreply@rsksolarenergy.com'
          git add "src/content/blog/$SLUG.mdx"
          git commit -m "$TITLE" -m 'Written and checked automatically: figures, a second model, the SEO guard, the writing check.'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f dry_run=false

      - name: Wait until it answers on the live site
        env:
          SLUG: ${{ steps.draft.outputs.slug }}
        run: |
          url="https://rsksolarenergy.com/blog/$SLUG/"
          for _ in $(seq 1 24); do
            sleep 30
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
          done
          echo 'Still not answering after twelve minutes. The post is on main, so check the deploy run.'
          exit 1

      - name: Email the link
        if: ${{ success() && env.SMTP_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_HOST }}
          server_port: ${{ env.MAIL_PORT }}
          # Port 465 wraps the whole session in TLS. Port 587 starts in the clear and upgrades with
          # STARTTLS, which is what Amazon SES is usually set up on.
          secure: ${{ env.MAIL_PORT != '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: RSK Solar Energy site <${{ env.MAIL_FROM }}>
          to: ${{ env.MAIL_TO }}
          subject: 'Live now: ${{ steps.draft.outputs.title }}'
          body: |
            ${{ steps.draft.outputs.title }}

            https://rsksolarenergy.com/blog/${{ steps.draft.outputs.slug }}/

            Written by ${{ steps.draft.outputs.provider }}, checked by ${{ steps.review.outputs.reviewer }}.
            It passed the figure check, the second model, the SEO guard and the writing check.

            If anything in it reads wrong, reply to this email and say what to change or that it
            should come down.

      - name: Say why nothing was published
        if: ${{ failure() && env.SMTP_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_HOST }}
          server_port: ${{ env.MAIL_PORT }}
          # Port 465 wraps the whole session in TLS. Port 587 starts in the clear and upgrades with
          # STARTTLS, which is what Amazon SES is usually set up on.
          secure: ${{ env.MAIL_PORT != '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: RSK Solar Energy site <${{ env.MAIL_FROM }}>
          to: ${{ env.MAIL_TO }}
          subject: 'No post today: a check stopped it'
          body: |
            Today's post was written but one of the checks stopped it, so nothing reached the
            live site. Nothing needs doing; the next run tries a fresh topic.

            What went wrong: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
