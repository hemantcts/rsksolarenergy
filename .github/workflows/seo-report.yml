name: Weekly search report

# Reads Search Console every Monday and emails the result. Nothing here touches the site.
#
# Secrets:
#   GSC_SA_JSON        the Google service-account key, whole JSON file. Create it in Google Cloud
#                      with the Search Console API enabled, then add its client_email as a user on
#                      the Search Console property.
#   SMTP_USER          the SMTP login: a Gmail address, or an SES SMTP user name.
#   SMTP_PASS          the SMTP password. For Gmail, an app password, not the account password.
#                      For SES, the generated SMTP password, not an AWS secret access key.
#   MOZ_TOKEN          optional. moz.com/api, free tier. Real Domain Authority, Page Authority,
#                      linking domains and Spam Score.
#   OPENPAGERANK_KEY   optional, and only needed without a Moz token. Free from the Dashboard at
#                      openpagerank.keywordseverywhere.com: a 0 to 10 score with monthly history.
#                      Keys start opr_. An old domcop.com key does not work against it.
#
# Variables (optional):
#   GSC_SITE      the property, default "sc-domain:rsksolarenergy.com". For a URL-prefix property
#                 use "https://rsksolarenergy.com/".
#   MAIL_HOST     the SMTP server, default smtp.gmail.com. For SES, email-smtp.<region>.amazonaws.com.
#   MAIL_PORT     default 465. Use 587 for SES on STARTTLS.
#   MAIL_FROM     the visible sender, needed for SES because its login is not an email address.
#
# Without SMTP_USER and SMTP_PASS the report is filed as a GitHub issue instead, so a week is never
# lost while the email is being set up.

on:
  schedule:
    # 04:30 UTC Monday, which is 10:00 in Mohali.
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  # The authority score is kept in files/authority.json so the report can show movement.
  contents: write

env:
  MAIL_TO: rajdeep.crest@gmail.com

jobs:
  report:
    env:
      # Where the mail goes out through. Defaults suit a Gmail address with an app password; set the
      # MAIL_* repository variables to send through Amazon SES or any other provider instead.
      MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.gmail.com' }}
      MAIL_PORT: ${{ vars.MAIL_PORT || '465' }}
      # SES usernames are not email addresses, so the visible sender is set apart from the login.
      MAIL_FROM: ${{ vars.MAIL_FROM || secrets.SMTP_USER }}
      # Hoisted so the mail steps can ask whether mail is set up at all: a step's "if" reads env,
      # never secrets.
      SMTP_USER: ${{ secrets.SMTP_USER }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The report lists the week's changes, which needs the history rather than one commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Today's date
        id: today
        run: echo "date=$(date -u +'%d %B %Y')" >> "$GITHUB_OUTPUT"

      - name: Pull the numbers
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          MOZ_TOKEN: ${{ secrets.MOZ_TOKEN }}
          OPENPAGERANK_KEY: ${{ secrets.OPENPAGERANK_KEY }}
        # The report itself goes to a file, not the log: it is long, and the log is public to anyone
        # with repository access. The authority section is printed, because when a key is wrong that
        # is where it says so.
        run: |
          node scripts/seo-report.mjs > /dev/null
          sed -n '/^## Authority/,/^## Close/p' seo-report.md | sed '$d'

      - name: Email it
        if: ${{ env.SMTP_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_HOST }}
          server_port: ${{ env.MAIL_PORT }}
          # Port 465 wraps the whole session in TLS. Port 587 starts in the clear and upgrades with
          # STARTTLS, which is what Amazon SES is usually set up on.
          secure: ${{ env.MAIL_PORT != '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: RSK Solar Energy site <${{ env.MAIL_FROM }}>
          to: ${{ env.MAIL_TO }}
          subject: 'Search report, week of ${{ steps.today.outputs.date }}'
          html_body: file://seo-report.md
          convert_markdown: true

      - name: File it as an issue instead, if no email is set up
        if: ${{ env.SMTP_USER == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Search report $(date +%F)" --body-file seo-report.md --label seo-report \
            || gh issue create --title "Search report $(date +%F)" --body-file seo-report.md

      - name: Keep this week's authority score
        run: |
          if [ -z "$(git status --porcelain -- files/authority.json)" ]; then echo 'No new score.'; exit 0; fi
          git config user.name 'rsk-content-bot'
          git config user.email 'noreply@rsksolarenergy.com'
          git add files/authority.json
          git commit -m 'Authority score for this week'
          git pull --rebase origin main
          git push origin HEAD:main
