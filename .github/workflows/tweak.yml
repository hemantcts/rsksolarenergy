name: Propose a tweak

# Major changes wait for a yes. Small ones go straight to main; what counts as major is in
# files/proposals/README.md.
#
# The change is already on a branch named tweak/<slug>, with a proposal file
# files/proposals/<slug>.md saying what changes and why. Running this workflow:
#
#   1. emails the proposal, with a link to this run;
#   2. stops, and asks for approval. GitHub emails a review request of its own;
#   3. on approval: merges the branch into main, deploys, deletes the branch, and confirms by email;
#   4. on rejection: leaves the branch alone, changes nothing, and says so by email.
#
# Approval is GitHub's own, against the "major-tweaks" environment, so it is recorded against the
# approving account and cannot be forged. That is why there is nothing here checking who replied.
#
# Secrets: SMTP_USER, SMTP_PASS. Variables: MAIL_HOST, MAIL_PORT, MAIL_FROM.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch holding the change, e.g. tweak/five-kw-price'
        type: string
        required: true

permissions:
  contents: write
  # The deploy is asked for by name after the merge: a push made with the built-in token does not
  # start another workflow.
  actions: write

concurrency:
  group: tweak-${{ inputs.branch }}
  cancel-in-progress: false

env:
  MAIL_TO: rajdeep.crest@gmail.com

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.gmail.com' }}
      MAIL_PORT: ${{ vars.MAIL_PORT || '465' }}
      MAIL_FROM: ${{ vars.MAIL_FROM || secrets.SMTP_USER }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
    outputs:
      subject: ${{ steps.proposal.outputs.subject }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Read the proposal
        id: proposal
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -e
          case "$BRANCH" in
            tweak/*) ;;
            *) echo 'The branch has to be named tweak/<slug>.'; exit 1 ;;
          esac
          SLUG="${BRANCH#tweak/}"
          FILE="files/proposals/$SLUG.md"
          test -f "$FILE" || { echo "No proposal at $FILE. The format is in files/proposals/README.md."; exit 1; }

          SUBJECT=$(sed -n 's/^subject:[[:space:]]*//p' "$FILE" | head -1)
          test -n "$SUBJECT" || { echo 'The proposal has no subject line.'; exit 1; }
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

          # Everything below the frontmatter is the body of the email.
          awk 'NR>1 && /^---$/ {found=1; next} found' "$FILE" > proposal-body.md

          {
            cat proposal-body.md
            echo
            echo '---'
            echo
            echo '## What changes in the code'
            echo
            echo '```'
            git diff --stat origin/main...HEAD | tail -40
            echo '```'
            echo
            echo "[See every line that changes](${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH)"
            echo
            echo '## To say yes or no'
            echo
            echo "[Open this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and press **Review deployments**, then Approve or Reject."
            echo
            echo 'Approving merges it and puts it live within a few minutes. Rejecting changes nothing and'
            echo 'leaves the branch where it is. Either way a short confirmation comes back.'
            echo
            echo 'GitHub will also email you a review request for this run, which goes to the same place.'
          } > email-body.md

      - name: Send it
        if: ${{ env.SMTP_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_HOST }}
          server_port: ${{ env.MAIL_PORT }}
          secure: ${{ env.MAIL_PORT != '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: RSK Solar Energy site <${{ env.MAIL_FROM }}>
          to: ${{ env.MAIL_TO }}
          subject: 'Waiting on you: ${{ steps.proposal.outputs.subject }}'
          html_body: file://email-body.md
          convert_markdown: true

  apply:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This is the gate. The job does not start until an approval is recorded against the
    # major-tweaks environment, and GitHub sends the review request.
    environment: major-tweaks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge it into main
        env:
          BRANCH: ${{ inputs.branch }}
          SUBJECT: ${{ needs.propose.outputs.subject }}
        run: |
          set -e
          git config user.name 'rsk-content-bot'
          git config user.email 'noreply@rsksolarenergy.com'
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout main
          git pull --ff-only origin main
          git merge --no-ff "origin/$BRANCH" -m "Approved: $SUBJECT" \
            || { echo 'This no longer merges cleanly into main. Nothing applied, and the branch is untouched.'; exit 1; }
          git push origin main
          git push origin --delete "$BRANCH"

      - name: Deploy it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f dry_run=false

  report:
    needs: [propose, apply]
    if: ${{ always() && needs.propose.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.gmail.com' }}
      MAIL_PORT: ${{ vars.MAIL_PORT || '465' }}
      MAIL_FROM: ${{ vars.MAIL_FROM || secrets.SMTP_USER }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
    steps:
      - name: Write the confirmation
        env:
          APPLIED: ${{ needs.apply.result }}
          BRANCH: ${{ inputs.branch }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            case "$APPLIED" in
              success)
                echo 'Approved and merged. It is going live now, which takes a few minutes.'
                ;;
              skipped|cancelled)
                echo "Rejected. Nothing was changed, and $BRANCH is still there if you want it later."
                ;;
              *)
                echo 'Approved, but it could not be merged, so nothing changed on the live site and the'
                echo 'branch is untouched. Usually this means main has moved on since the branch was made.'
                ;;
            esac
            echo
            echo "$RUN"
          } > reply.txt
          cat reply.txt

      - name: Send it
        if: ${{ env.SMTP_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_HOST }}
          server_port: ${{ env.MAIL_PORT }}
          secure: ${{ env.MAIL_PORT != '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: RSK Solar Energy site <${{ env.MAIL_FROM }}>
          to: ${{ env.MAIL_TO }}
          subject: 'Re: ${{ needs.propose.outputs.subject }}'
          body: file://reply.txt
